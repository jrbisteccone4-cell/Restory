<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AEON - Il Portale dei Frammenti di Tempo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030712;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* UI Overlay & HUD */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 32px;
        }
        header {
            text-align: center;
            pointer-events: auto;
        }
        header h1 {
            font-size: 1.25rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }
        header p {
            font-size: 0.7rem;
            color: #38bdf8;
            margin-top: 6px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        /* HUD Istruzioni Interattive */
        .hud-instruction {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            color: #94a3b8;
            pointer-events: auto;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.5s ease;
        }
        .hud-instruction span {
            color: #38bdf8;
            font-weight: 500;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <header>
            <h1>AEON</h1>
            <p>Osservatorio Globale Quantico</p>
        </header>

        <div class="hud-instruction" id="hud-text">
            Trascina per ruotare il globo • <span>Pizzica o clicca a lungo</span> per attivare il Focus Armonico
        </div>
    </div>

    <script>
        // Setup della Scena 3D
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Creazione del Globo di Vetro Zaffiro
        const globeGeo = new THREE.SphereGeometry(2, 64, 64);
        
        // Materiale riflettente avanzato (effetto vetro liquido)
        const globeMat = new THREE.MeshPhysicalMaterial({
            color: 0x0284c7,
            metalness: 0.1,
            roughness: 0.1,
            transmission: 0.6, // Trasparenza vetrosa
            thickness: 1.2,
            reflectivity: 0.9,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1
        });

        const globe = new THREE.Mesh(globeGeo, globeMat);
        scene.add(globe);

        // Particelle di Luce / Frammenti di Tempo sulla superficie
        const particlesGeo = new THREE.BufferGeometry();
        const particlesCount = 300;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            // Distribuzione sferica attorno al globo
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 2.05; // Leggermente sopra la superficie del globo

            posArray[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            posArray[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            posArray[i * 3 + 2] = r * Math.cos(phi);
        }

        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.03,
            color: 0x38bdf8,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particleSphere = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particleSphere);

        // Luci Atmosferiche
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x38bdf8, 2, 50);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        const purpleLight = new THREE.PointLight(0x818cf8, 1.5, 50);
        purpleLight.position.set(-5, -5, -5);
        scene.add(purpleLight);

        // Interazione e Gestione del "Focus Armonico"
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let isHarmonicFocusActive = false;

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging || isHarmonicFocusActive) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            globe.rotation.y += deltaX * 0.005;
            globe.rotation.x += deltaY * 0.005;
            particleSphere.rotation.y = globe.rotation.y;
            particleSphere.rotation.x = globe.rotation.x;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        // Simulazione del Focus Armonico al doppio click / tap prolungato
        window.addEventListener('dblclick', () => {
            triggerHarmonicFocus();
        });

        function triggerHarmonicFocus() {
            isHarmonicFocusActive = true;
            const hud = document.getElementById('hud-text');
            hud.innerHTML = "<span>Focus Armonico Attivo:</span> Apertura portale dimensionale in corso...";
            hud.style.borderColor = "rgba(129, 140, 248, 0.6)";

            // Animazione di espansione (zoom quantico)
            let scaleFactor = 1;
            const expandInterval = setInterval(() => {
                scaleFactor += 0.05;
                globe.scale.set(scaleFactor, scaleFactor, scaleFactor);
                particleSphere.scale.set(scaleFactor, scaleFactor, scaleFactor);
                globeMat.opacity = Math.max(0, 1 - (scaleFactor - 1) * 2);

                if (scaleFactor > 3) {
                    clearInterval(expandInterval);
                    setTimeout(resetHarmonicFocus, 2000);
                }
            }, 30);
        }

        function resetHarmonicFocus() {
            isHarmonicFocusActive = false;
            globe.scale.set(1, 1, 1);
            particleSphere.scale.set(1, 1, 1);
            globeMat.opacity = 1;
            const hud = document.getElementById('hud-text');
            hud.innerHTML = "Trascina per ruotare il globo • <span>Pizzica o clicca a lungo</span> per attivare il Focus Armonico";
            hud.style.borderColor = "rgba(56, 189, 248, 0.2)";
        }

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Loop di Animazione
        function animate() {
            requestAnimationFrame(animate);

            if (!isDragging && !isHarmonicFocusActive) {
                globe.rotation.y += 0.002;
                particleSphere.rotation.y += 0.002;
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
